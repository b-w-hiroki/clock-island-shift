<style>

<script>
"use strict";
// ===== レベル定義（つくる画面＝回転0の座標） =====
const N = 7;
const key = (x, y) => x + "," + y;
function tub(mirror, extraStone) {
  const t = new Set();
  for (let x = 0; x < N; x++) t.add(key(x, 6));                       // 床
  const wallCol = mirror ? 6 : 0;                                    // 全体の壁
  const holeCol = mirror ? 0 : 6;                                    // 穴あき壁（回転後に床の穴になる）
  for (let y = 0; y < 6; y++) t.add(key(wallCol, y));
  for (const y of [0, 1, 4, 5]) t.add(key(holeCol, y));
  if (extraStone) t.add(extraStone);
  return t;
}
function box() {
  const t = new Set();
  for (let x = 0; x < N; x++) { t.add(key(x, 6)); t.add(key(x, 0)); }
  for (let y = 1; y < 6; y++) { t.add(key(0, y)); t.add(key(6, y)); }
  return t;
}
// Coordinates are zero-based. Stacks become horizontal, single-use walkways after SHIFT.
const LEVELS = [
  { name:'はじめての足場', hint:'光る井戸をタップして箱を積む。高さが、回転後の道の長さになる。',
    terrain:tub(false), stones:new Set(), wells:[4], blockCount:4, wellCap:4,
    start:{x:1,y:5}, goal:{x:5,y:0}, shifts:1, tools:[] },
  { name:'逆向きの階段', hint:'今度は左回り。茶色い石も、足場の一部として使える。',
    terrain:tub(true,key(2,2)), stones:new Set([key(2,2)]), wells:[4], blockCount:3, wellCap:3,
    start:{x:5,y:5}, goal:{x:1,y:0}, shifts:1, tools:[] },
  { name:'箱を分ける', hint:'一つの長い道だけでは石にぶつかる。別の井戸にも足場を。',
    terrain:tub(false,key(3,4)), stones:new Set([key(3,4)]), wells:[2,3,4], blockCount:5, wellCap:4,
    start:{x:1,y:5}, goal:{x:5,y:0}, shifts:1, tools:[] },
  { name:'試して、巻き戻す', hint:'二つの高さをつなごう。↩で戻せる。⏸は落下を観察するために。',
    terrain:(()=>{const t=tub(false,key(3,4));t.add(key(1,2));return t})(), stones:new Set([key(3,4),key(1,2)]),
    wells:[2,4], blockCount:5, wellCap:4, start:{x:1,y:5}, goal:{x:5,y:0}, shifts:1, tools:['stop'] },
  { name:'勢いで割る', hint:'⚡を入れてから落ちよう。短い落下でもヒビ床を割れる。',
    terrain:(()=>{const t=tub(false);t.delete(key(6,0));t.add(key(5,1));return t})(),
    stones:new Set(), cracks:new Set([key(5,1)]), wells:[3], blockCount:4, wellCap:4,
    start:{x:1,y:5}, goal:{x:5,y:1}, shifts:1, tools:['fast'] },
  { name:'天井への道', hint:'橋を渡って着地したら重力を反転。石の下に旗がある。',
    terrain:tub(false,key(1,1)), stones:new Set([key(1,1)]), wells:[4], blockCount:4, wellCap:4,
    start:{x:1,y:5}, goal:{x:2,y:1}, shifts:1, tools:['reverse'] },
  { name:'はずむ足場', hint:'高い道の端から右へ。長く落ちると、進む向きへ跳ねる。',
    terrain:(()=>{const t=tub(false,key(3,0));t.add(key(6,3));return t})(), stones:new Set([key(3,0)]),
    wells:[2], blockCount:4, wellCap:4, start:{x:1,y:5}, goal:{x:4,y:0}, shifts:1, tools:['bounce'] },
  { name:'風の渡し場', hint:'風は落下ごとに右へ一歩。石を越えた先に長い足場を作ろう。',
    terrain:tub(false,key(3,4)), stones:new Set([key(3,4)]), wind:1,
    wells:[4], blockCount:5, wellCap:5, start:{x:1,y:5}, goal:{x:3,y:1}, shifts:1, tools:['wind'] },
  { name:'浮遊の発射台', hint:'まず箱に着地。そこから無重力にして、柱の横を回り込もう。',
    terrain:(()=>{const t=box();for(const y of [2,3,4])t.add(key(3,y));t.delete(key(0,5));t.delete(key(6,5));return t})(),
    stones:new Set(), wells:[2], blockCount:1, wellCap:1,
    start:{x:1,y:5}, goal:{x:4,y:3}, shifts:1, tools:['zero'] },
  { name:'自分を足場に', hint:'ここは2回転。箱は離れると消え、回転前の自分は残像になる。',
    terrain:tub(false), stones:new Set(), wells:[4], blockCount:4, wellCap:4,
    start:{x:1,y:5}, goal:{x:4,y:3}, shifts:2, tools:['ghost'] },
  { name:'渦への階段', hint:'足場をつないで紫の渦へ。出口の旗まで一気に渡れる。',
    terrain:tub(false,key(3,0)), stones:new Set([key(3,0)]), portals:[{x:5,y:1},{x:2,y:0}],
    wells:[4], blockCount:4, wellCap:4, start:{x:1,y:5}, goal:{x:2,y:0}, shifts:1, tools:['warp'] },
  { name:'時計島の帰り道', hint:'石と箱で足場を作る。重力を反転して渦へ昇り、出口でもそのまま上へ。',
    terrain:(()=>{const t=tub(false);for(let y=0;y<6;y++)t.delete(key(0,y));t.delete(key(6,5));
      for(const p of ['3,2','4,3','5,3','4,1','5,1'])t.add(p);return t})(),
    stones:new Set(['3,2','4,3','5,3','4,1','5,1']), portals:[{x:1,y:1},{x:5,y:2}],
    wells:[2], blockCount:3, wellCap:3, start:{x:1,y:5}, goal:{x:4,y:2}, shifts:1, tools:['warp','reverse'] },
];
const hasTool = tool => LEVELS[levelIdx].tools.includes(tool);
// =================================================

let levelIdx = 0;
let S = null;
const board = document.getElementById('board');
const boardWrap = document.getElementById('boardWrap');
const phaseEl = document.getElementById('phase');
const blocksLeftEl = document.getElementById('blocksLeft');
const msgEl = document.getElementById('msg');
const nextBtn = document.getElementById('nextBtn');
let cells = [];
let playerEl = null;
let ghostEl = null;
let portalEls = [];
let animating = false;
let rotationTimer = null;
function cancelRotation() {
  if (rotationTimer !== null) clearTimeout(rotationTimer);
  rotationTimer = null; animating = false;
  boardWrap.style.transform = 'rotate(0deg)';
}

let history = [];
let timeStopped = false;
let fastFall = false;
let fallMomentum = 0;
let gravMode = 'down'; // 'down' | 'up' | 'zero'
const gravDir = () => gravMode === 'up' ? -1 : 1;
let lastDx = 0;
let bouncing = false;
let bounceChain = 0; // v15: 1回の操作内でのバウンド連鎖数（無限ループ対策、上限3）

// ===== v15: 効果音（Web Audio の簡易合成、外部ファイルなし） =====
let audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { /* 音が出ない環境では無音で続行 */ }
}
document.addEventListener('pointerdown', () => { ensureAudio(); bgmStart(); });
function tone(freqA, freqB, dur, type, vol, delay = 0) {
  if (!audioCtx) return;
  try {
    const t0 = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freqA, t0);
    if (freqB !== freqA) o.frequency.exponentialRampToValueAtTime(Math.max(30, freqB), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function noiseBurst(dur, vol) {
  if (!audioCtx) return;
  try {
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const g = audioCtx.createGain(); g.gain.value = vol;
    src.connect(g); g.connect(audioCtx.destination); src.start();
  } catch (e) {}
}
const seTap = () => tone(660, 660, 0.06, 'square', 0.06);
const seRotate = () => tone(180, 620, 0.2, 'sawtooth', 0.05);

// ===== v16: BGM（Web Audio合成の軽いループ、外部ファイルなし） =====
// オルゴール風：Cメジャーペンタトニックの旋律＋静かなアルペジオ。8小節ループ。
const BGM_STEP = 60 / 92 / 2; // 8分音符（92 BPM）
const BGM_CHORDS = [ // [ベース音, アルペジオ音階]
  [130.81, [261.63, 329.63, 392.00]], // C
  [98.00,  [246.94, 293.66, 392.00]], // G
  [110.00, [220.00, 261.63, 329.63]], // Am
  [87.31,  [174.61, 220.00, 261.63]], // F
  [130.81, [261.63, 329.63, 392.00]], // C
  [98.00,  [246.94, 293.66, 392.00]], // G
  [87.31,  [174.61, 220.00, 261.63]], // F
  [98.00,  [246.94, 293.66, 392.00]], // G
];
const E5 = 659.25, G5 = 783.99, A5 = 880.00, D5 = 587.33, C5 = 523.25;
const BGM_MELODY = [ // 64ステップ（8小節×8）。0は休符
  E5, 0, G5, 0, A5, 0, G5, 0,
  E5, 0, D5, 0, E5, 0, 0, 0,
  A5, 0, G5, 0, E5, 0, D5, 0,
  E5, 0, 0, 0, D5, 0, 0, 0,
  C5, 0, E5, 0, G5, 0, A5, 0,
  G5, 0, E5, 0, D5, 0, E5, 0,
  D5, 0, 0, 0, E5, 0, G5, 0,
  C5, 0, 0, 0, 0, 0, 0, 0,
];
let bgmTimer = null, bgmStepCount = 0, bgmNextTime = 0, bgmMuted = false;
function bgmSchedule() {
  if (!audioCtx) return;
  while (bgmNextTime < audioCtx.currentTime + 0.35) {
    const s = bgmStepCount % 64;
    const bar = Math.floor(s / 8), st = s % 8;
    const [bass, arp] = BGM_CHORDS[bar];
    const delay = Math.max(0, bgmNextTime - audioCtx.currentTime);
    if (st === 0) tone(bass, bass, 1.4, 'sine', 0.04, delay);
    if (st % 2 === 0) tone(arp[[0, 1, 2, 1][st / 2]], arp[[0, 1, 2, 1][st / 2]], 0.5, 'triangle', 0.015, delay);
    const m = BGM_MELODY[s];
    if (m) tone(m, m, 0.7, 'sine', 0.045, delay);
    bgmNextTime += BGM_STEP;
    bgmStepCount++;
  }
}
function bgmStart() {
  if (bgmMuted) return;
  ensureAudio();
  if (!audioCtx || bgmTimer) return;
  bgmStepCount = 0;
  bgmNextTime = audioCtx.currentTime + 0.06;
  bgmTimer = setInterval(bgmSchedule, 200);
}
function bgmStop() { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } }
function updateMuteBtn() { document.getElementById('muteBtn').classList.toggle('off', bgmMuted); }

const SAVE_KEY = 'tokeijima-shift-progress-v1';
let progress = { unlocked: 1, cleared: [] };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) {
    const p = JSON.parse(raw);
    if (p && Number.isInteger(p.unlocked) && p.unlocked >= 1) progress = { unlocked: Math.min(LEVELS.length, p.unlocked), cleared: Array.isArray(p.cleared) ? p.cleared.slice(0, LEVELS.length).map(v => v === true) : [] };
  }
} catch (e) { /* 保存できない環境ではメモリ上のみ */ }
function saveProgress() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) {} }
function continueIdx() {
  for (let i = 0; i < LEVELS.length; i++) if (!progress.cleared[i]) return i;
  return LEVELS.length - 1;
}
let started = false;
let completionTimer = null;
function cancelCompletion() { if (completionTimer !== null) clearTimeout(completionTimer); completionTimer = null; }
function startLevel(idx) {
  started = true;

  hideOverlay();

}
function onCleared() {

  progress.unlocked = Math.max(progress.unlocked, Math.min(LEVELS.length, levelIdx + 2));
  saveProgress();
  if (levelIdx === LEVELS.length - 1) { const completedState = S; cancelCompletion(); completionTimer = setTimeout(() => { completionTimer = null; if (S === completedState && S.done && S.result === 'クリア！') showAllClear(); }, 1100); }
}
function hideOverlay() { document.getElementById('overlay').style.display = 'none'; }
function showTitle() {

const wipeDialog = document.getElementById('wipeDialog');
function requestWipe() {

function initialState(idx) {
  const L = LEVELS[idx];
  return {
    rot: 0, shiftsUsed: 0,
    terrain: new Set(L.terrain),
    stones: new Set(L.stones),
    cracks: new Set(L.cracks || []),
    blocks: new Set(),
    player: { ...L.start },
    goal: { ...L.goal },
    ghost: null,
    portals: L.portals ? L.portals.map(p => ({ ...p })) : null,
    portalLock: false,
    wind: L.wind || 0,
    done: false,
    result: "",
  };
}

function snapshot() {
  history.push({
    terrain: [...S.terrain], stones: [...S.stones], fastFall, lastDx, cracks: [...S.cracks], blocks: [...S.blocks],
    player: { ...S.player }, goal: { ...S.goal }, rot: S.rot, shiftsUsed: S.shiftsUsed, grav: gravMode,
    ghost: S.ghost ? { ...S.ghost } : null, portalLock: S.portalLock,
    portals: S.portals ? S.portals.map(p => ({ ...p })) : null,
  });
  if (history.length > 80) history.shift();
}

function rewind() {
  cancelRotation();
  queuedDx = 0; bouncing = false;
  const snap = history.pop();
  if (!snap) return;
  cancelCompletion();
  bounceChain = 0;
  stopFalling();
  timeStopped = false;
  gravMode = snap.grav;
  S.ghost = snap.ghost;
  S.portals = snap.portals;
  S.portalLock = snap.portalLock;
  S.terrain = new Set(snap.terrain);
  S.stones = new Set(snap.stones);
  fastFall = snap.fastFall; lastDx = snap.lastDx;
  S.cracks = new Set(snap.cracks);
  S.blocks = new Set(snap.blocks);
  S.player = snap.player;
  S.goal = snap.goal;
  S.rot = snap.rot;
  S.shiftsUsed = snap.shiftsUsed;
  S.done = false;
  S.result = '';
  render();
  if (S.shiftsUsed > 0 && !supported() && gravMode !== 'zero') startFalling();
}

function buildDom() {
  board.innerHTML = '';
  cells = [];
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const d = document.createElement('div');
      d.className = 'cell';
      d.dataset.x = x; d.dataset.y = y;
      d.addEventListener('click', () => onCellTap(x, y));
      board.appendChild(d);
      cells.push(d);
    }
  }
  playerEl = document.createElement('div');
  playerEl.id = 'player';
  ghostEl = document.createElement('div');
  ghostEl.id = 'ghost';
  portalEls = [document.createElement('div'), document.createElement('div')];
  portalEls.forEach(el => el.className = 'portal');
}

function cellAt(x, y) { return cells[y * N + x]; }
function solid(x, y) {
  return S.terrain.has(key(x, y)) || S.blocks.has(key(x, y))
    || (S.ghost && S.ghost.x === x && S.ghost.y === y);
}

let falling = false;
let fallTimer = null;
function supported() {
  const { x, y } = S.player;
  const ny = y + gravDir();
  if (ny < 0 || ny >= N) return S.terrain.has(key(x, y));
  return solid(x, ny);
}
let queuedDx = 0;
function flushQueue() {
  if (queuedDx !== 0 && !S.done) {
    const d = queuedDx;
    queuedDx = 0;
    move(d);
  }
}

function startFalling() {
  maybeTeleport();
  if (gravMode === 'zero') { checkGoal(); render(); return; }
  if (supported()) { checkGoal(); render(); flushQueue(); return; }
  falling = true;
  fallMomentum = 0;
  const interval = () => fastFall ? 32 : 70;
  const gain = () => fastFall ? 2 : 1;
  const step = () => {
    if (S.done) { falling = false; return; }
    if (timeStopped) { fallTimer = setTimeout(step, 90); return; } // 時間停止中は空中で待つ
    const { x, y } = S.player;
    const d = gravDir();
    const ny = y + d;
    if (ny < 0 || ny >= N) {
      if (!S.terrain.has(key(x, y))) fail();
      else if (fallMomentum > 0) seLand();
      falling = false; checkGoal(); render(); flushQueue(); return;
    }
    if (solid(x, ny)) {
      if (x === S.goal.x && y === S.goal.y) { falling = false; checkGoal(); render(); return; } // ゴール着地が最優先
      const below = key(x, ny);
      if (S.cracks.has(below) && fallMomentum >= 3) {
        // 勢いでヒビ床を割り抜ける
        S.cracks.delete(below);
        S.terrain.delete(below);
        seBreak();
        S.player.y = ny;
        fallMomentum += gain();
        render();
        fallTimer = setTimeout(step, interval());
        return;
      }
      if (hasTool('bounce') && fallMomentum >= 3 && lastDx !== 0 && bounceChain < 3) {
        // バウンド：勢いを残して、進んでいた向きへ斜めに跳ね返る
        // v15: 連鎖上限3回。ワープ等と組み合わさった無限バウンドを防ぐ
        falling = false;
        bouncing = true;
        bounceChain++;
        seBounce();
        let left = Math.min(3, fallMomentum - 2);
        const bst = () => {
          if (S.done) { bouncing = false; return; }
          if (left <= 0) { bouncing = false; startFalling(); return; }
          const nx = S.player.x + lastDx, ny2 = S.player.y - gravDir();
          if (nx < 0 || nx >= N || ny2 < 0 || ny2 >= N || solid(nx, ny2) || solid(nx, S.player.y)) {
            bouncing = false; startFalling(); return;
          }
          S.player.x = nx; S.player.y = ny2; left--;
          maybeTeleport();
          render();
          checkGoal();
          if (S.done) { bouncing = false; render(); return; }
          fallTimer = setTimeout(bst, 65);
        };
        fallTimer = setTimeout(bst, 65);
        render();
        return;
      }
      if (fallMomentum > 0) seLand();
      falling = false; checkGoal(); render(); flushQueue(); return;
    }
    S.player.y = ny;
    fallMomentum += gain();
    // 風：落下・上昇のたびに横へ流される
    if (S.wind !== 0) {
      const wx = S.player.x + S.wind;
      if (wx >= 0 && wx < N && !solid(wx, S.player.y)) S.player.x = wx;
    }
    maybeTeleport();
    render();
    fallTimer = setTimeout(step, interval());
  };
  step(); // 最初の1マスは即時に落とす（テンポと割り込みの両立）
}
function stopFalling() {
  if (fallTimer) clearTimeout(fallTimer);
  fallTimer = null;
  falling = false;
}

function render() {
  const L = LEVELS[levelIdx];
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const d = cellAt(x, y);
      d.className = 'cell'
        + (S.terrain.has(key(x, y)) ? (S.cracks.has(key(x, y)) ? ' crack' : (S.stones.has(key(x, y)) ? ' stone' : ' terrain')) : '')
        + (S.blocks.has(key(x, y)) ? ' block' : '')
        + (S.goal.x === x && S.goal.y === y ? ' goal' : '')
        + (S.shiftsUsed === 0 && L.wells.includes(x) && !S.terrain.has(key(x, y)) ? ' well' : '');
    }
  }
  ghostEl.remove(); portalEls.forEach(el => el.remove());
  if (S.ghost) cellAt(S.ghost.x, S.ghost.y).appendChild(ghostEl);
  if (S.portals) S.portals.forEach((p, i) => cellAt(p.x, p.y).appendChild(portalEls[i]));
  cellAt(S.player.x, S.player.y).appendChild(playerEl);
  playerEl.style.transform = gravMode === 'up' ? 'scaleY(-1)' : '';
  document.body.classList.toggle('walk', S.shiftsUsed > 0);
  document.body.classList.toggle('gravup', gravMode === 'up');
  document.body.classList.toggle('zeroG', gravMode === 'zero');

  phaseEl.className = S.shiftsUsed === 0 ? '' : 'walk';
  phaseEl.innerHTML = `<b>${levelIdx + 1}面：${L.name}</b><br>` + (S.done ? L.hint :
    S.shiftsUsed === 0 ? L.hint : `◀▶で進む・箱は離れると消える` +
    (hasTool('reverse') ? ' ／ 着地して重力反転' : '') +
    (hasTool('zero') ? ' ／ 着地して無重力：▲▼◀▶' : '') +
    (S.wind ? ' ／ 風 →' : ''));
  document.getElementById('leftBtn').disabled = (S.shiftsUsed === 0 && gravMode !== 'zero') || S.done;
  document.getElementById('rightBtn').disabled = (S.shiftsUsed === 0 && gravMode !== 'zero') || S.done;
  document.getElementById('upBtn').disabled = gravMode !== 'zero' || S.done;
  document.getElementById('downBtn').disabled = gravMode !== 'zero' || S.done;
  document.getElementById('rotL').disabled = S.done || S.shiftsUsed >= L.shifts;
  document.getElementById('rotR').disabled = S.done || S.shiftsUsed >= L.shifts;

  document.getElementById('ffBtn').classList.toggle('on', fastFall);
  for (const [id, available] of [['stopBtn', hasTool('stop')], ['ffBtn', hasTool('fast')], ['gravBtn', hasTool('reverse') || hasTool('zero')]]) { document.getElementById(id).hidden = !available; document.getElementById(id).disabled = !available || S.done; }
  document.getElementById('gravBtn').disabled = S.done || S.shiftsUsed === 0 || falling || animating || bouncing;
  document.getElementById('gravBtn').title = hasTool('zero') ? '着地中に無重力を切り替え（G）' : '着地中に重力反転（G）';
  document.getElementById('rewindBtn').disabled = history.length === 0;
  const left = L.blockCount - S.blocks.size;
  blocksLeftEl.textContent = (S.shiftsUsed === 0 ? '箱 ' + '■'.repeat(left) + '□'.repeat(L.blockCount - left) + ' ／ ' : '') + '回転 あと' + (L.shifts - S.shiftsUsed) + '回';
  const failed = S.done && S.result === 'おちた';
  document.getElementById('rewindBtn').textContent = failed ? '↩ 1手戻す（Z）' : '↩';
  document.getElementById('retryBtn').textContent = failed ? '↻ やり直す（R）' : '↻';
  msgEl.textContent = S.result;
  msgEl.className = S.result === 'クリア！' ? 'clear' : (S.result ? 'fail' : '');
  nextBtn.style.display = (S.done && S.result === 'クリア！' && levelIdx < LEVELS.length - 1) ? 'block' : 'none';
}

function maybeTeleport() {
  if (!S.portals) return;
  const [a, b] = S.portals;
  const onA = S.player.x === a.x && S.player.y === a.y;
  const onB = S.player.x === b.x && S.player.y === b.y;
  if (!onA && !onB) { S.portalLock = false; return; }
  if (S.portalLock) return;
  S.portalLock = true;
  S.player = onA ? { ...b } : { ...a };
  seWarp();
}

function fail() { S.done = true; S.result = 'おちた'; seFail(); }

function checkGoal() {
  if (!S.done && S.player.x === S.goal.x && S.player.y === S.goal.y) {
    S.done = true;
    S.result = 'クリア！';
    seClear();
    onCleared();
  }
}

function onCellTap(x, y) {
  if (S.shiftsUsed !== 0 || S.done || animating || falling || bouncing) return;
  const L = LEVELS[levelIdx];
  if (!L.wells.includes(x)) return;
  const stack = [];
  for (let yy = 0; yy < N; yy++) if (S.blocks.has(key(x, yy))) stack.push(yy);
  if (stack.length && y === Math.min(...stack)) {
    snapshot();
    S.blocks.delete(key(x, Math.min(...stack)));
    seTap();
  } else if (S.blocks.size < L.blockCount && stack.length < L.wellCap) {
    let yy = 5;
    while (yy >= 0 && (S.blocks.has(key(x, yy)) || S.terrain.has(key(x, yy)))) yy--;
    if (yy >= 0) { snapshot(); S.blocks.add(key(x, yy)); seTap(); }
  }
  render();
}

function rotate(dir) {
  if (S.done || animating || bouncing || S.shiftsUsed >= LEVELS[levelIdx].shifts) return;
  bounceChain = 0;
  seRotate();
  snapshot();
  S.shiftsUsed++;
  S.ghost = hasTool('ghost') ? { ...S.player } : null; // 残像：回転前の自分の場所が足場として残る（画面固定）
  stopFalling(); // 落下中でも割り込んで回せる
  animating = true;
  boardWrap.style.transform = `rotate(${dir * 90}deg)`;
  rotationTimer = setTimeout(() => {
    rotationTimer = null;
    boardWrap.classList.add('noanim');
    const rotSet = (set) => new Set([...set].map(k => {
      const [x, y] = k.split(',').map(Number);
      return dir > 0 ? key(N - 1 - y, x) : key(y, N - 1 - x);
    }));
    const rotPt = (p) => dir > 0 ? { x: N - 1 - p.y, y: p.x } : { x: p.y, y: N - 1 - p.x };
    S.terrain = rotSet(S.terrain);
    S.stones = rotSet(S.stones);
    S.cracks = rotSet(S.cracks);
    S.blocks = rotSet(S.blocks);
    if (S.portals) S.portals = S.portals.map(rotPt);
    S.player = rotPt(S.player);
    S.goal = rotPt(S.goal);
    S.rot = (S.rot + (dir > 0 ? 1 : 3)) % 4;
    boardWrap.style.transform = 'rotate(0deg)';
    render();
    void boardWrap.offsetWidth;
    boardWrap.classList.remove('noanim');
    animating = false;
    startFalling(); // 新しい向きで落下を再開（着地できる）
  }, 430);
}

function moveFree(dx, dy) { // 無重力：4方向に浮遊移動
  if (!hasTool('zero') || gravMode !== 'zero' || S.done || animating) return;
  bounceChain = 0;
  const nx = S.player.x + dx, ny = S.player.y + dy;
  if (nx < 0 || nx >= N || ny < 0 || ny >= N) return;
  if (solid(nx, ny)) return;
  snapshot();
  S.player.x = nx; S.player.y = ny;
  if (dx !== 0) lastDx = dx;
  maybeTeleport();
  render();
  checkGoal();
  render();
}

function move(dx) {
  if (gravMode === 'zero') { moveFree(dx, 0); return; }
  if (S.done) return;
  if (animating || falling || bouncing) { queuedDx = dx; return; } // 先行入力：着地したら自動で進む
  if (S.shiftsUsed === 0) return;
  bounceChain = 0;
  const nx = S.player.x + dx;
  if (nx < 0 || nx >= N) return;
  if (solid(nx, S.player.y)) return;
  snapshot();
  lastDx = dx;
  const from = { ...S.player };
  S.player.x = nx;
  const supportKey = key(from.x, from.y + gravDir());
  if (S.blocks.has(supportKey)) {
    S.blocks.delete(supportKey);
  }
  maybeTeleport();
  render();
  startFalling();
}

function toggleGravity() {
  if ((!hasTool('reverse') && !hasTool('zero')) || S.shiftsUsed === 0 || S.done || animating || falling || bouncing) return;
  bounceChain = 0;
  snapshot();
  stopFalling();
  gravMode = gravMode === 'down' ? (hasTool('zero') ? 'zero' : 'up') : 'down';
  render();
  startFalling();
}

function toggleTime() { if (!hasTool('stop') || S.done || animating) return; timeStopped = !timeStopped; render(); }
function toggleFast() { if (!hasTool('fast') || S.done || animating) return; fastFall = !fastFall; render(); }

function reset() { cancelCompletion(); cancelRotation(); stopFalling(); history = []; timeStopped = false; fastFall = false; gravMode = 'down'; lastDx = 0; queuedDx = 0; bouncing = false; bounceChain = 0; S = initialState(levelIdx); render(); }
function nextLevel() { if (levelIdx < LEVELS.length - 1) { levelIdx++; reset(); } }

document.getElementById('rotL').addEventListener('click', () => rotate(-1));
document.getElementById('rotR').addEventListener('click', () => rotate(1));
document.getElementById('leftBtn').addEventListener('click', () => move(-1));
document.getElementById('rightBtn').addEventListener('click', () => move(1));
document.getElementById('upBtn').addEventListener('click', () => moveFree(0, -1));
document.getElementById('downBtn').addEventListener('click', () => moveFree(0, 1));
document.getElementById('retryBtn').addEventListener('click', reset);
document.getElementById('stopBtn').addEventListener('click', toggleTime);
document.getElementById('ffBtn').addEventListener('click', toggleFast);
document.getElementById('rewindBtn').addEventListener('click', rewind);
document.getElementById('gravBtn').addEventListener('click', toggleGravity);
nextBtn.addEventListener('click', nextLevel);
document.getElementById('titleBtn').addEventListener('click', showTitle);
document.getElementById('muteBtn').addEventListener('click', () => { bgmMuted = !bgmMuted; if (bgmMuted) bgmStop(); else bgmStart(); updateMuteBtn(); });
document.addEventListener('keydown', (e) => {
  if (wipeDialog.open || document.getElementById('overlay').style.display !== 'none') return;
  if (e.code === 'Space') { e.preventDefault(); rotate(1); }
  if (e.key === 'ArrowRight') move(1);
  if (e.key === 'ArrowLeft') move(-1);
  if (e.key === 'ArrowUp') { e.preventDefault(); moveFree(0, -1); }
  if (e.key === 'ArrowDown') { e.preventDefault(); moveFree(0, 1); }
  if (e.key === 'q' || e.key === 'Q') rotate(-1);
  if (e.key === 'r' || e.key === 'R') reset();
  if (e.key === 't' || e.key === 'T') toggleTime();
  if (e.key === 'f' || e.key === 'F') toggleFast();
  if (e.key === 'z' || e.key === 'Z') rewind();
  if (e.key === 'g' || e.key === 'G') toggleGravity();
});

buildDom();
levelIdx = continueIdx();
reset();
showTitle();
</script>
</body>
</html>
